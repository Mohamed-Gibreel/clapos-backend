services:
  database:
    image: postgres
    container_name: app-database-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./src/database/:/var/lib/postgresql/

  redis:
    image: redis
    container_name: app-redis-dev
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ./src/redis/data:/data

  minio:
    image: minio/minio
    container_name: app-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - ${MINIO_PORT}:9000
      - 9001:9001
    volumes:
      - ./src/minio/data:/data
