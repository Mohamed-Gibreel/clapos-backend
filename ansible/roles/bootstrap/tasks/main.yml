- name: Ensure automation user exists
  user:
    name: ansible
    comment: 'Ansible automation user'
    shell: /bin/bash
    state: present
    create_home: yes

- name: Ensure .ssh directory exists
  file:
    path: /home/ansible/.ssh
    state: directory
    owner: ansible
    group: ansible
    mode: '0700'

- name: Add authorized keys
  copy:
    src: authorized_keys
    dest: /home/ansible/.ssh/authorized_keys
    owner: ansible
    group: ansible
    mode: '0600'

- name: Setup restricted sudo for automation user
  template:
    src: sudoers.j2
    dest: /etc/sudoers.d/ansible
    owner: root
    group: root
    mode: '0440'
